  - key: external_sources
    side: liabilities
    code: "B.+C."
    row: "104"  # verified
    labels: ["Cizí zdroje"]
    abbreviated: true
    en: External sources (provisions and liabilities)
  - key: provisions
    side: liabilities
    code: "B."
    row: "105"  # verified
    labels: ["Rezervy"]
    abbreviated: true
    en: Provisions
  - key: liabilities
    side: liabilities
    code: "C."
    row: "110"  # verified
    labels: ["Závazky"]
    abbreviated: true
    en: Liabilities
  - key: liabilities_long_term
    side: liabilities
    code: "C.I."
    row: "111"  # verified
    labels: ["Dlouhodobé závazky"]
    abbreviated: true
    en: Long-term liabilities
  - key: bank_loans_long_term
    side: liabilities
    code: "C.I.2."
    labels: ["Závazky k úvěrovým institucím"]
    abbreviated: false
    en: Long-term bank loans
  - key: liabilities_short_term
    side: liabilities
    code: "C.II."
    row: "126"  # verified
    labels: ["Krátkodobé závazky"]
    abbreviated: true
    en: Short-term liabilities
  - key: bank_loans_short_term
    side: liabilities
    code: "C.II.2."
    labels: ["Závazky k úvěrovým institucím"]
    abbreviated: false
    en: Short-term bank loans
  - key: trade_payables_short_term
    side: liabilities
    code: "C.II.4."
    row: "132"  # verified
    labels: ["Závazky z obchodních vztahů"]
    abbreviated: false
