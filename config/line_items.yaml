# Line-item dictionary for the rule-based parser (CIPW-5, used by CIPW-32).
#
# Structure follows the Czech forms in Vyhláška č. 500/2002 Sb. (layout valid since 2016).
# Per field:
#   key            canonical name used in src/schema.py and everywhere downstream
#   side           balance sheet only: assets | liabilities
#   code           "označení" as printed, normalized: no spaces, dot after every part ("B.II.", "C.II.2.", "B.+C.")
#                  income-statement subtotals use their stars ("*", "**", "***")
#   row            "číslo řádku" of the full form; verified on a real 2025 statement where marked `# verified`.
#                  Row numbers are printed by most accounting software but are not always present (micro forms omit them).
#   labels         official Czech label first, then known variants (abbreviated forms, older forms, typical OCR-free variants)
#   abbreviated    true if the line also exists in the abbreviated (zkrácený) form
#   en             English name for the UI and docs
#
# Extend `labels` whenever the parser meets a new variant (CIPW-32). Never remove a variant that matched real data.
version: 1

balance_sheet:
  # ---------------- AKTIVA ----------------
  - key: total_assets
    side: assets
    code: ""
    row: "001"  # verified
    labels: ["AKTIVA CELKEM", "Aktiva celkem"]
    abbreviated: true
    en: Total assets
  - key: receivables_subscribed_capital
    side: assets
    code: "A."
    row: "002"
    labels: ["Pohledávky za upsaný základní kapitál"]
    abbreviated: true
    en: Subscribed capital unpaid
  - key: fixed_assets
    side: assets
    code: "B."
    row: "003"  # verified
    labels: ["Stálá aktiva", "Dlouhodobý majetek"]
    abbreviated: true
    en: Fixed assets
  - key: intangible_assets
    side: assets
    code: "B.I."
    row: "004"  # verified
    labels: ["Dlouhodobý nehmotný majetek"]
    abbreviated: true
    en: Intangible fixed assets
  - key: tangible_assets
    side: assets
    code: "B.II."
    row: "014"  # verified
    labels: ["Dlouhodobý hmotný majetek"]
    abbreviated: true
    en: Tangible fixed assets
  - key: financial_fixed_assets
    side: assets
    code: "B.III."
    row: "027"  # verified
    labels: ["Dlouhodobý finanční majetek"]
    abbreviated: true
    en: Long-term financial assets
  - key: current_assets
    side: assets
    code: "C."
    row: "037"  # verified
    labels: ["Oběžná aktiva"]
    abbreviated: true
    en: Current assets
  - key: inventories
    side: assets
    code: "C.I."
    row: "038"  # verified
    labels: ["Zásoby"]
    abbreviated: true
    en: Inventories
  - key: receivables
    side: assets
    code: "C.II."
    row: "046"  # verified
    labels: ["Pohledávky"]
    abbreviated: true
    en: Receivables
  - key: receivables_long_term
    side: assets
    code: "C.II.1."
    row: "047"
    labels: ["Dlouhodobé pohledávky"]
    abbreviated: true
    en: Long-term receivables
  - key: receivables_short_term
    side: assets
    code: "C.II.2."
    row: "057"  # verified
    labels: ["Krátkodobé pohledávky"]
    abbreviated: true
    en: Short-term receivables
  - key: trade_receivables_short_term
    side: assets
    code: "C.II.2.1."
    row: "058"  # verified
    labels: ["Pohledávky z obchodních vztahů"]
    abbreviated: false
    en: Trade receivables (short-term)
  - key: short_term_financial_assets
    side: assets
    code: "C.III."
    row: "071"
    labels: ["Krátkodobý finanční majetek"]
    abbreviated: true
    en: Short-term financial assets
  - key: cash
    side: assets
    code: "C.IV."
    row: "075"  # verified
    labels: ["Peněžní prostředky"]
    abbreviated: true
    en: Cash and cash equivalents
  - key: accruals_assets
    side: assets
    code: "D."
    row: "078"  # verified
    labels: ["Časové rozlišení aktiv", "Časové rozlišení"]
    abbreviated: true
    en: Prepayments and accrued income

  # ---------------- PASIVA ----------------
  - key: total_liabilities_equity
    side: liabilities
    code: ""
    row: "082"  # verified
    labels: ["PASIVA CELKEM", "Pasiva celkem"]
    abbreviated: true
    en: Total liabilities and equity
  - key: equity
    side: liabilities
    code: "A."
    row: "083"  # verified
    labels: ["Vlastní kapitál"]
    abbreviated: true
    en: Equity
  - key: share_capital
    side: liabilities
    code: "A.I."
    row: "084"  # verified
    labels: ["Základní kapitál"]
    abbreviated: true
    en: Share capital
  - key: share_premium_capital_funds
    side: liabilities
    code: "A.II."
    row: "088"  # verified
    labels: ["Ážio a kapitálové fondy"]
    abbreviated: true
    en: Share premium and capital funds
  - key: funds_from_profit
    side: liabilities
    code: "A.III."
    row: "096"  # verified
    labels: ["Fondy ze zisku"]
    abbreviated: true
    en: Funds from profit
  - key: retained_earnings
    side: liabilities
    code: "A.IV."
    row: "099"  # verified
    labels: ["Výsledek hospodaření minulých let (+/-)", "Výsledek hospodaření minulých let"]
    abbreviated: true
    en: Retained earnings (prior years)
  - key: profit_current_period
    side: liabilities
    code: "A.V."
    row: "102"  # verified
