# Fides settings (CIPW-45). Loaded by src/settings.py; see docs/settings.md.
#
# Override any value without editing this file:
#   environment variable or .env:  FIDES_OFFLINE=true, FIDES_OCR__DPI=400, FIDES_LLM__MODEL=...
# Secrets never go here: the API key comes from MISTRAL_API_KEY in .env or the environment.

# No call to the internet: no LLM (the assessment is the rule-based one) and no ARES lookup (company data from saved
# answers and data/companies.csv only). Everything else runs (extraction, checks, ratios).
offline: false

# A JSON-lines log of every pipeline run in paths.logs
log_runs: true

# Relative to the repository root (/workspace in the Docker image)
paths:
  raw: data/raw
  ground_truth: data/ground_truth
  fixtures: data/fixtures
  outputs: outputs
  logs: outputs/logs
  dictionary: config/line_items.yaml
  prompts: prompts

# Reading-stage OCR, tuned on the real scans in CIPW-25 (docs/ocr.md)
ocr:
  dpi: 300
  lang: ces
  psm: 6
  remove_shading: true
  deskew: true
  binarize: adaptive
  block: 31
  offset: 15
  median: 0
  grey_profile: true
  remove_lines: true
  tessdata: models/tessdata   # the Czech model shipped with Fides (official tessdata, CIPW-25): the same everywhere

# Cells the accounting checks doubt are read again from a crop at this resolution, digits only (CIPW-11)
reread:
  enabled: true
  dpi: 400

# Reading scans faster (CIPW-50): pages OCR'd side by side and a light page locator with the full one as fallback
performance:
  ocr_workers: 0         # 0 = one per CPU core, 1 = one page at a time
  tesseract_threads: 1   # threads per Tesseract process when pages run side by side (0 = Tesseract's default)
  light_locator: true

# Paths to Tesseract when it is not on PATH: set TESSERACT_CMD / TESSDATA_PREFIX in .env (they differ per computer)
tesseract: {}

# The language model of the AI report (CIPW-16): Mistral in production (CIPW-58, docs/llm.md). The key comes from
# MISTRAL_API_KEY in .env or the environment; a Mistral model on an own server gives its address as url.
llm:
  provider: mistral
  url: https://api.mistral.ai/v1   # or e.g. http://llm.internal:8000/v1 (vLLM), which may need no key
  model: mistral-medium-3.5        # the model Cofidis uses internally
  timeout: 120                     # seconds for one answer
  price_in_per_mtok: 0             # USD per million tokens, for the cost in the result; 0 = not counted
  price_out_per_mtok: 0
  max_cost_usd: 0.50               # upper limit for one AI report

# Sign-in (CIPW-62, docs/users.md). none: no sign-in (one computer). local: accounts kept by Fides; the admin
# account is created at the first start (password from FIDES_AUTH__ADMIN_PASSWORD in .env, or generated into
# outputs/admin-password.txt); more users with `python scripts/users.py add NAME --role analyst`.
auth:
  mode: none
  idle_minutes: 120     # a session ends after this long without a request
  max_hours: 12         # and after this long in any case
  max_failures: 5       # wrong passwords for one name before its sign-in is blocked
  block_minutes: 15
  secure_cookie: auto   # Secure cookie when the request came over HTTPS (behind a proxy: X-Forwarded-Proto)

# Results, their PDFs and corrections, users and sessions in one SQLite file (CIPW-60, docs/app.md).
storage:
  path: outputs/fides.db   # docker compose keeps outputs/ on the host
  keep_days: null          # results older than this are deleted; null keeps them
  visibility: team         # team: everyone sees every result; own: only their own (admins see all)

# The AI assessment report (CIPW-16, docs/assessment.md) and its PDF (CIPW-43, docs/report.md). Every value waits for an answer of the team or of Cofidis:
# change it here, no code to edit.
report:
  language: cs           # cs | en: the labels of the PDF and the language of the AI report (Cofidis: Czech and English)
  provider: gemini       # gemini | mistral | anthropic; open question
  model: ""              # "" = the provider's default model
  worsening_pct: 20      # a worsening above this is a risk (prompt v4 onwards); open question
  rating:
    disabled_rules: []   # rules left out, from R1, R2, R3, R5 (R4 and R6 always apply)
    partial: true        # no bankruptcy score: rate from the balance sheet alone (R7 high, R8 medium) or no rating
  recommendation:        # what each risk rating gets; open question for Cofidis (proposal below)
    low: recommended              # recommended | caution | not_recommended | no_recommendation
    medium: caution
    high: not_recommended
    none: no_recommendation       # no rating (data do not allow one)
  # The PDF in Cofidis' brand (CIPW-43). Colours from Cofidis' toolkit (https://www.cofidis.hu/toolkit). Put its logo
  # (PNG, horizontal, on white) e.g. in config/brand/ and set `logo`.
  primary: "#D0103A"   # Cofidis red, C0 M100 Y80 K0
  accent: "#FECB00"    # Cofidis yellow, C0 M20 Y100 K0
  logo: config/brand/cofidis-logo.png   # from the toolkit (horizontal, on white); "" = the name in red

# Company name, address, industry (CZ-NACE) and size by IČO from the public register ARES (CIPW-44).
# Only the IČO is sent; answers are saved in outputs/cache/ares.
ares:
  enabled: true
  url: https://ares.gov.cz/ekonomicke-subjekty-v-be/rest
  timeout: 5           # seconds
  cache: ""            # folder of the saved answers; "" = outputs/cache/ares

api:
  max_upload_mb: 60
  max_results: 20      # analysed files kept in memory by the web app's API
