name: CI

on:
  # Every push to any branch (task branches like CIPW-32-parser included), so a PR already shows the result.
  push:
    branches: ["**"]
  # Pull requests from forks only; PRs from branches in this repo are covered by the push run above.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Tests must never call the paid LLM API (CIPW-23). An empty key makes any accidental call fail fast.
      ANTHROPIC_API_KEY: ""
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      # Only the program: the Czech and English models ship with Fides (models/tessdata, TESSDATA_PREFIX in the
      # settings). apt problems (a third-party repository of the runner image, a mirror out of sync) are printed as
      # an annotation, which is public, unlike the log; a failed `apt-get update` does not stop the install.
      - name: Install Tesseract
        run: |
          if ! sudo apt-get update > apt.log 2>&1; then
            echo "::warning title=apt-get update::$(grep -E '^(E|W):' apt.log | tail -5 | tr '\n' ' ')"
          fi
          if ! sudo apt-get install -y --no-install-recommends tesseract-ocr >> apt.log 2>&1; then
            echo "::error title=apt-get install::$(grep -E '^(E|W):' apt.log | tail -8 | tr '\n' ' ')"
            exit 1
          fi
          tesseract --version | head -1
          TESSDATA_PREFIX=models/tessdata tesseract --list-langs | grep -x ces

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Tests (pytest)
        run: pytest -q --junitxml=reports/junit.xml

      - name: Failing tests as annotations
        if: failure()
        run: python scripts/junit_annotations.py reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14

  web:
    name: Web app (typecheck, tests, build)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
