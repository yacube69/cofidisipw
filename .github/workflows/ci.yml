name: CI

on:
  # Every push to any branch (task branches like CIPW-32-parser included), so a PR already shows the result.
  push:
    branches: ["**"]
  # Pull requests from forks only; PRs from branches in this repo are covered by the push run above.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Tests must never call the paid LLM API (CIPW-23). An empty key makes any accidental call fail fast.
      ANTHROPIC_API_KEY: ""
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract with Czech data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces
          tesseract --version | head -1
          tesseract --list-langs | grep -x ces

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Tests (pytest)
        run: pytest -q --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14
