name: Docker image

# CD: build the Fides image (Tesseract + Czech data + app) on every push, smoke-test it inside the container
# and, for main and release tags only, publish it to GitHub Container Registry (ghcr.io/<owner>/<repo>).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fides:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (Tesseract + Czech OCR inside the image)
        run: docker run --rm fides:ci python scripts/hello_ocr.py

      - name: Pipeline test inside the image (digital sample statement, no LLM)
        run: |
          docker run --rm -v "$PWD/data:/workspace/data:ro" fides:ci             python -m src.pipeline data/raw/25080776_2025_statement.pdf --skip-report --out /tmp/out

      - name: Is this a publishing run?
        id: publish
        run: echo "enabled=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
