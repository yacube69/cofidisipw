name: Docker image

# CD: build the Fides image (Tesseract + Czech data + app) on every push, smoke-test it inside the container
# and, for main and release tags only, publish it to GitHub Container Registry (ghcr.io/<owner>/<repo>).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fides:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_DESCRIBE=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (Tesseract + Czech OCR inside the image)
        run: docker run --rm fides:ci python scripts/hello_ocr.py

      - name: Pipeline test inside the image (digital sample statement, no LLM)
        run: |
          docker run --rm -v "$PWD/data:/workspace/data:ro" -v /tmp/out:/tmp/out fides:ci             python -m src.pipeline data/raw/25080776_2025_statement.pdf --skip-report --out /tmp/out
          # the audit block names the commit the image was built from (CIPW-45)
          python3 -c "import json, glob; a = json.load(open(glob.glob('/tmp/out/*.json')[0]))['audit']; assert a['git_commit'] == '${{ github.sha }}', a; print('audit', a['run_id'], a['settings_hash'])"

      - name: Web app and API inside the image (no data mounted, sample only)
        run: |
          docker run -d --name fides-web -p 8000:8000 fides:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && break; sleep 2; done
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
          curl -fs http://localhost:8000/api/samples | grep -q mondi-2025
          curl -fs -o /dev/null http://localhost:8000/api/results/mondi-2025/pages/20
          docker rm -f fides-web

      - name: Is this a publishing run?
        id: publish
        run: echo "enabled=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_DESCRIBE=${{ github.ref_name }}
          cache-from: type=gha
