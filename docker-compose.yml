# Fides for one user: `docker compose up`, then open http://localhost:8000
services:
  fides:
    image: ghcr.io/yacube69/cofidisipw:main
    build: .
    ports:
      - "127.0.0.1:8000:8000" # only this computer; remove 127.0.0.1 to share it on a network
    env_file:
      - path: .env # MISTRAL_API_KEY for the AI report (optional, docs/llm.md)
        required: false
    volumes:
      - ./data:/workspace/data:ro
      - ./outputs:/workspace/outputs # the database fides.db (results, users), run logs, admin-password.txt
    restart: unless-stopped
